[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-metalens-nn"
version = "0.1.0"
description = "Gated, memory-monitored fiber-tip metalens inverse-design trial"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
metalens = "fiber_metalens_nn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
